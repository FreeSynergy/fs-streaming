# Copy to <repo>/.github/workflows/check.yml - runs fmt, clippy (pedantic), tests and the coding rules on every push.
name: check
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    uses: FreeSynergy/fs-release/.github/workflows/check.yml@main
    with:
      # The relay test with a real ffmpeg publisher times out on the runner; it says it is skipped (README) and runs in gates.sh on a developer machine.
      test-env: "FS_STREAMING_NO_FFMPEG=1"
