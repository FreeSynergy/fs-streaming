[package]
name = "fs-streaming-app"
description = "The streaming program of FreeSynergy: window shell and the generated admin frontend over streams and targets (ADR 0065, 0066)"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
fs-streaming-core = { path = "../fs-streaming-core" }
fs-streaming-relay = { path = "../fs-streaming-relay" }
fs-objects = { git = "https://github.com/FreeSynergy/fs-objects", tag = "v0.0.1" }
fs-types = { git = "https://github.com/FreeSynergy/fs-interfaces", tag = "v0.0.11" }
# provisional: becomes a tag once reviewed (Strategy switches it); this commit uses fs-types v0.0.11
fs-admin-frontend = { git = "https://github.com/FreeSynergy/fs-components", rev = "7b47a65b3aa87fa0306b37e5e7bf6512277606c0" }
fs-components-app = { git = "https://github.com/FreeSynergy/fs-components", rev = "7b47a65b3aa87fa0306b37e5e7bf6512277606c0" }
fs-components-fields = { git = "https://github.com/FreeSynergy/fs-components", rev = "7b47a65b3aa87fa0306b37e5e7bf6512277606c0" }
fs-components-styles = { git = "https://github.com/FreeSynergy/fs-components", rev = "7b47a65b3aa87fa0306b37e5e7bf6512277606c0" }
tokio = { version = "1", features = ["rt-multi-thread", "sync"] }

[dev-dependencies]
tempfile = "3"
