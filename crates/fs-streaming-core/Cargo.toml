[package]
name = "fs-streaming-core"
description = "Program core of FreeSynergy streaming: streams, targets, keys as secrets, state, no media"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
fs-store = { git = "https://github.com/FreeSynergy/fs-store", tag = "v0.3.0" }
fs-interfaces = { git = "https://github.com/FreeSynergy/fs-interfaces", tag = "v0.29.0" }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
thiserror = "2"
async-trait = "0.1"
tokio = { version = "1", features = ["sync"] }
sha2 = "0.10"
getrandom = "0.3"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
