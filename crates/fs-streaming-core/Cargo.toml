[package]
name = "fs-streaming-core"
description = "Program core of FreeSynergy streaming: streams, targets, keys as secrets, state, no media"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
fs-objects = { git = "https://github.com/FreeSynergy/fs-objects", tag = "v0.0.1" }
# The contract and the provider rule (ADR 0045).
fs-interfaces = { git = "https://github.com/FreeSynergy/fs-interfaces", tag = "v0.0.1" }
# The type description (ADR 0066); the same tag as the admin frontend, so both name one `TypeDescription`.
fs-types = { git = "https://github.com/FreeSynergy/fs-interfaces", tag = "v0.0.2" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
thiserror = "2"
async-trait = "0.1"
tokio = { version = "1", features = ["sync", "rt"] }
sha2 = "0.10"
subtle = "2"
getrandom = "0.3"
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
